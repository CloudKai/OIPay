# OIPay's disposable development/test services. Never link this project to production.
# Retain the resource ID to reuse existing local containers, ports, and database volumes.
project_id = "splittogether-tests"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3100"
additional_redirect_urls = ["http://localhost:3100/**", "http://127.0.0.1:3100/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 100

[studio]
enabled = false

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[realtime]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
