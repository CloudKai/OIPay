services:
  db:
    image: postgres:16
    container_name: oipay-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-splittogether}
      POSTGRES_USER: ${POSTGRES_USER:-splittogether}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-splittogether}
    ports:
      - "5433:5432"
    volumes:
      - oipay_pgdata:/var/lib/postgresql/data

volumes:
  oipay_pgdata:
    # Preserve the existing database volume when the project folder is renamed.
    name: splittogether_splittogether_pgdata
