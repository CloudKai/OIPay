services:
  db:
    image: postgres:16
    container_name: splittogether-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-splittogether}
      POSTGRES_USER: ${POSTGRES_USER:-splittogether}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-splittogether}
    ports:
      - "5433:5432"
    volumes:
      - splittogether_pgdata:/var/lib/postgresql/data

volumes:
  splittogether_pgdata:
